<div class="flex flex-col h-screen">
  <app-header class="shrink-0"></app-header>
  <main class="flex-1 overflow-y-auto">
    <div class="flex min-h-full flex-col">
      <div class="flex-1 px-[16px] pt-[16px] max-w-6xl mx-auto w-full">
        <router-outlet />
      </div>
      <app-premium-card>
        <app-footer></app-footer>
      </app-premium-card>
    </div>
    <p-scrolltop
      styleClass="!bottom-[110px] !right-6"
      target="parent"
      [threshold]="200"
      icon="pi pi-arrow-up"
      [buttonProps]="{ severity: 'contrast', raised: true, rounded: true }"
    ></p-scrolltop>
  </main>
  <app-accessibility-control></app-accessibility-control>
  <app-audio-player></app-audio-player>
</div>
