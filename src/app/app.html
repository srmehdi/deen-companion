<div class="flex flex-col h-screen">
  <app-header class="shrink-0"></app-header>
  <main class="flex-1 overflow-y-auto">
    <div class="flex min-h-full flex-col">
      <div class="flex-1 px-[16px] pt-[16px] max-w-6xl mx-auto w-full">
        <router-outlet />
      </div>
      <app-premium-card>
        <app-footer></app-footer>
      </app-premium-card>
    </div>
    <p-scrolltop
      styleClass="max-sm:!bottom-[140px] max-sm:!right-0 max-sm:!left-0 max-sm:!m-auto !bottom-[110px] !right-8 !h-[40px] !w-[40px]"
      target="parent"
      [threshold]="600"
      icon="pi pi-arrow-up !text-[16px]"
      [buttonProps]="{ severity: 'contrast', raised: true, rounded: true }"
    ></p-scrolltop>
  </main>
  <app-accessibility-control></app-accessibility-control>
  <app-audio-player></app-audio-player>
</div>
<app-status-modal
  [state]="modalService.state()"
  [message]="modalService.message()"
  (onClose)="modalService.close()"
/>
