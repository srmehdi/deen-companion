<div class="flex flex-col h-screen">
  <app-header class="shrink-0"></app-header>
  <main class="flex-1 overflow-y-auto pt-[72px]">
    <div class="flex min-h-full flex-col">
      <div class="flex-1 px-[12px] sm:px-[16px] pt-[12px] sm:pt-[16px] max-w-6xl mx-auto w-full">
        <router-outlet />
      </div>
      <app-premium-card class="z-9999!">
        <app-footer></app-footer>
      </app-premium-card>
    </div>
    <p-scrolltop
      styleClass="!right-0 !left-0 !m-auto !bottom-[160px] lg:!bottom-[120px] !h-[40px] !w-[40px]"
      target="parent"
      [threshold]="600"
      icon="pi pi-arrow-up !text-[16px]"
      [buttonProps]="{ severity: 'contrast', raised: true, rounded: true }"
    ></p-scrolltop>
  </main>
  <app-accessibility-control></app-accessibility-control>
  <app-audio-player></app-audio-player>
</div>
<app-status-modal
  [state]="modalService.state()"
  [message]="modalService.message()"
  (onClose)="modalService.close()"
/>
