<div class="relative flex flex-col h-screen overflow-hidden">
  <!-- Header 1 -->
  <app-header
    #appHeader
    class="fixed top-0 left-0 right-0 z-100 transition-transform duration-300 ease-out will-change-transform"
    [class.-translate-y-full]="headerState.isHeaderHidden()"
    [isHidden]="headerState.isHeaderHidden()"
  ></app-header>

  <!-- Main scroll container -->
  <main (scroll)="onMainScroll($event)" class="flex-1 overflow-y-auto pt-[72px]">
    <div class="flex min-h-full flex-col">
      <div class="flex-1 px-[12px] sm:px-[16px] pt-[12px] sm:pt-[16px] max-w-6xl mx-auto w-full">
        <router-outlet />
      </div>
      <app-premium-card class="z-9999!">
        <app-footer></app-footer>
      </app-premium-card>
    </div>

    <!-- Scroll-to-Top Button -->
    <p-scrolltop
      styleClass="animate-bounce bg-gradient-to-br! from-[#bf953f]! via-[#fcf6ba]! to-[#aa771c]! !right-0 !left-0 !m-auto !bottom-[170px] md:!bottom-[160px] lg:!bottom-[120px] !h-[32px] !w-[60px] !gap-[4px] !text-[16px] !rounded-xl"
      target="parent"
      [threshold]="600"
      icon="pi pi-arrow-up !text-[13px]"
      [buttonProps]="{ severity: 'contrast', raised: true, rounded: true, label: 'TOP' }"
    ></p-scrolltop>
  </main>

  <!-- Global Overlays & Modals -->
  <app-accessibility-control></app-accessibility-control>
  <app-audio-player></app-audio-player>
</div>

<app-status-modal
  [state]="modalService.state()"
  [message]="modalService.message()"
  (onClose)="modalService.close()"
/>
