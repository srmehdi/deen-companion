<div class="min-h-screen transition-colors">
  <app-header></app-header>
  <main class="px-4 pt-4 pb-20 max-w-6xl mx-auto">
    <router-outlet />
    <app-premium-card class="mt-4">
      <app-footer></app-footer>
    </app-premium-card>
  </main>
</div>

<div class="fam-dock">
  <div class="dock-content">
    <span class="icon-small">A</span>
    <input
      type="range"
      min="80"
      max="180"
      [value]="fontSize"
      (input)="onSliderChange($event)"
      aria-label="Font Size Slider"
    />
    <span class="icon-large">A</span>
    <span class="percentage-label">{{ fontSize }}%</span>
    <button class="reset-btn" (click)="resetFontSize()" title="Reset to Default">
      <span class="reset-icon">↺</span>
    </button>
  </div>
</div>
