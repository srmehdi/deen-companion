<div class="relative flex flex-col h-screen overflow-hidden">
  <!-- Header 1 -->
  <app-header
    #appHeader
    class="fixed top-0 left-0 right-0 z-100 transition-transform duration-300 ease-out will-change-transform"
    [class.-translate-y-full]="headerState.isHeaderHidden()"
    [isHidden]="headerState.isHeaderHidden()"
  ></app-header>

  <!-- Main scroll container -->
  <main (scroll)="onMainScroll($event)" class="flex-1 overflow-y-auto pt-[72px] pb-[40px] lg:pb-0">
    <div class="flex min-h-full flex-col">
      <div class="flex-1 px-[8px] sm:px-[16px] pt-[12px] sm:pt-[16px] max-w-6xl mx-auto w-full">
        <router-outlet />
      </div>
      <app-premium-card class="">
        <app-footer></app-footer>
      </app-premium-card>
    </div>

    <!-- Scroll-to-Top Button -->
    <p-scrolltop
      styleClass="animate-bounce bg-gradient-to-br! from-[#bf953f]! via-[#fcf6ba]! to-[#aa771c]! !right-0 !left-0 !m-auto !bottom-[10px] lg:!bottom-[110px] !h-[32px] !w-[60px] !gap-[4px] !text-[16px] !rounded-xl"
      target="parent"
      [threshold]="600"
      icon="pi pi-arrow-up !text-[13px]"
      [buttonProps]="{ severity: 'contrast', raised: true, rounded: true, label: 'TOP' }"
    ></p-scrolltop>
  </main>

  <!-- Mobile Bottom Navigation Bar (Independent of header transforms) -->
  <app-mobile-bottom-nav></app-mobile-bottom-nav>
  <!-- Global Overlays & Modals -->
  <app-accessibility-control></app-accessibility-control>
  <app-audio-player></app-audio-player>
</div>

<app-status-modal
  [state]="modalService.state()"
  [message]="modalService.message()"
  (onClose)="modalService.close()"
/>
@if (hasUpdate()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-900/60 p-[16px] backdrop-blur-sm transition-opacity duration-300"
  >
    <div
      class="relative w-full max-w-sm rounded-[16px] border border-emerald-500/20 bg-white p-[24px] shadow-2xl transition-all dark:bg-slate-900"
    >
      <!-- Glow background accent -->
      <div
        class="absolute -top-10 left-1/2 -translate-x-1/2 h-20 w-20 rounded-full bg-emerald-500/10 blur-xl"
      ></div>

      <!-- Header Icon Badge -->
      <div
        class="mx-auto mb-[16px] flex h-[56px] w-[56px] items-center justify-center rounded-full bg-emerald-50 ring-8 ring-emerald-50/50 dark:bg-emerald-950/40 dark:ring-emerald-900/20"
      >
        <svg
          class="h-[28px] w-[28px] text-emerald-600 dark:text-emerald-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"
          />
        </svg>
      </div>

      <!-- Text Content -->
      <div class="text-center">
        <h3 class="text-[18px] font-bold text-slate-900 dark:text-slate-100">
          New Version Available
        </h3>
        <p class="mt-[8px] text-[14px] text-slate-500 dark:text-slate-400">
          A new version is ready with the latest improvements. Click
          <span class="font-semibold">"Update Now"</span> to continue.
        </p>
      </div>

      <!-- Action Buttons -->
      <div class="mt-[24px] flex items-center gap-[12px]">
        <button
          type="button"
          (click)="dismiss.emit()"
          class="w-1/2 rounded-xl border border-slate-200 bg-white px-[16px] py-[10px] text-[14px] font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:bg-slate-700 cursor-pointer"
        >
          Later
        </button>
        <button
          type="button"
          (click)="reloadApp()"
          class="w-1/2 rounded-xl bg-gradient-to-r from-emerald-600 to-teal-600 px-[16px] py-[10px] text-[14px] font-semibold text-white shadow-md shadow-emerald-500/25 hover:from-emerald-700 hover:to-teal-700 focus:outline-none focus:ring-2 focus:ring-emerald-500 active:scale-95 transition-all cursor-pointer"
        >
          Update Now
        </button>
      </div>
    </div>
  </div>
}

<!-- 🔔 Daily Reminder Top Dialog Overlay -->
<app-daily-reminder-banner />
