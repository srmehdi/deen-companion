<!-- <nav
  class="fixed left-0 right-0 top-0 z-50 border-b border-white/20 dark:border-white/10 bg-white/70 dark:bg-bg-green backdrop-blur-2xl shadow-[0_8px_40px_rgba(15,23,42,0.08)] dark:shadow-[0_8px_40px_rgba(0,0,0,0.35)]"
> -->
<nav
  class="fixed left-0 right-0 top-0 z-100 border-b border-white/20 dark:border-white/10 bg-white/70 dark:bg-bg-green backdrop-blur-2xl shadow-[0_8px_40px_rgba(15,23,42,0.08)] dark:shadow-[0_8px_40px_rgba(0,0,0,0.35)] transition-transform duration-300"
  [ngClass]="{ '-translate-y-full': isHeaderHidden() }"
>
  <div
    class="relative max-w-6xl mx-auto h-[72px] px-[16px] md:px-[24px] flex items-center justify-between"
  >
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-[12px] group">
      <!-- <div
        class="w-[43px] h-[43px] rounded-[8px] bg-gradient-to-br from-divine-emerald to-sacred-gold text-white flex items-center justify-center shadow-lg transition duration-300 group-hover:scale-105"
      >
        <span class="text-[20px]">☪</span>
      </div> -->
      <div
        class="w-[43px] h-[43px] rounded-[8px] overflow-hidden bg-gradient-to-br from-divine-emerald to-sacred-gold text-white flex items-center justify-center shadow-lg transition duration-300 group-hover:scale-105"
      >
        <img src="assets/images/logo.svg" alt="Icon" class="w-full h-full object-contain p-[2px]" />
      </div>

      <div>
        <h1
          class="text-[20px] font-extrabold bg-gradient-to-r from-emerald-600 via-teal-500 to-amber-500 bg-clip-text text-transparent"
        >
          Deen Companion
        </h1>

        <p class="text-[9.6px] uppercase tracking-[0.20em] text-sacred-gold">
          Quran • Hadees • Dua • Namaz
        </p>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden lg:flex items-center gap-[4px]">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Home
      </a>
      <a
        routerLink="/quran"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Quran
      </a>
      <a
        routerLink="/hadees"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Hadees
      </a>

      <a
        routerLink="/dua"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Dua
      </a>
      <a
        routerLink="/namaz-guide"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Namaz
      </a>
      <a
        routerLink="/islamic-videos"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        class="px-[16px] py-[8px] leading-normal rounded-full text-[14px] font-medium text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-700 dark:hover:bg-white/10 transition-all duration-300 hover:-translate-y-0.5"
      >
        Videos
      </a>

      <!-- Theme Switch -->
      <div
        class="ml-[12px] flex items-center gap-[8px] rounded-full border border-white/30 dark:border-white/10 bg-white/40 dark:bg-white/5 backdrop-blur-xl px-[12px] py-[8px] shadow-sm"
      >
        <span class="text-[16px]">☀️</span>

        <button
          (click)="theme.toggleManual()"
          class="relative w-[48px] h-[24px] rounded-full bg-slate-300 dark:bg-premium-emerald transition-colors cursor-pointer"
        >
          <div
            class="absolute top-[4px] left-[4px] dark:left-[28px] w-[16px] h-[16px] rounded-full bg-white dark:bg-sacred-gold shadow transition-all duration-300"
          ></div>
        </button>

        <span class="text-[16px]">🌙</span>

        <div class="w-px h-[20px] bg-slate-300 dark:bg-white/10"></div>

        <label
          class="flex items-center gap-[8px] text-[12px] text-slate-500 dark:text-slate-400 cursor-pointer"
        >
          <input
            type="checkbox"
            class="w-[16px] h-[16px] cursor-pointer"
            [checked]="theme.autoMode()"
            (change)="theme.setAutoMode($any($event.target).checked)"
          />

          Auto
        </label>
      </div>
    </div>

    <!-- Mobile Button -->
    <button
      class="lg:hidden burger p-2 rounded-xl hover:bg-slate-100 dark:hover:bg-white/10 transition bg-gradient-to-br dark:from-divine-emerald from-sacred-gold"
      (click)="toggleMenu()"
    >
      <svg
        class="w-[28px] h-[28px] text-emerald-600 dark:text-emerald-500"
        width="22"
        height="22"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <!-- Bottom Gold Accent -->
    <div
      class="absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-sacred-gold/60 to-transparent"
    ></div>
  </div>

  <!-- Mobile Menu -->
  <!-- <div
    class="lg:hidden absolute right-[12px] top-full w-[280px] rounded-[12px] border border-white/20 dark:border-white/10 bg-white/90 dark:bg-bg-green/95 backdrop-blur-2xl shadow-2xl transition-all duration-300"
    [ngClass]="
      isToggle() ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-3 pointer-events-none'
    "
  > -->
  <div
    class="lg:hidden absolute right-[12px] top-full z-[110] w-[280px] rounded-[12px] border border-white/20 dark:border-white/10 bg-white/90 dark:bg-bg-green/95 backdrop-blur-2xl shadow-2xl transition-[opacity,transform] duration-200 ease-out"
    [ngClass]="
      isToggle()
        ? 'opacity-100 translate-y-0 pointer-events-auto'
        : 'opacity-0 -translate-y-3 pointer-events-none'
    "
  >
    <div class="p-[20px]">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Home
      </a>
      <a
        routerLink="/quran"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Quran
      </a>
      <a
        routerLink="/hadees"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Hadees
      </a>

      <a
        routerLink="/dua"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Dua
      </a>
      <a
        routerLink="/namaz-guide"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Namaz
      </a>
      <a
        routerLink="/islamic-videos"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Videos
      </a>

      <div class="border-t border-slate-200 dark:border-white/10 my-3"></div>

      <div
        class="flex items-center justify-between rounded-xl bg-slate-50 dark:bg-white/5 p-[12px]"
      >
        <span class="text-[14px] font-medium">Theme</span>

        <button
          (click)="theme.toggleManual()"
          class="relative w-[48px] h-[24px] rounded-full bg-slate-300 dark:bg-premium-emerald"
        >
          <div
            class="absolute top-[4px] left-[4px] dark:left-[28px] w-[16px] h-[16px] rounded-full bg-white dark:bg-sacred-gold transition-all duration-300"
          ></div>
        </button>
      </div>

      <label
        class="mt-[12px] flex items-center justify-between rounded-xl bg-slate-50 dark:bg-white/5 p-[12px] cursor-pointer"
      >
        <span class="text-[14px]">Automatic Theme</span>

        <input
          type="checkbox"
          class="w-[24px] h-[24px]"
          [checked]="theme.autoMode()"
          (change)="theme.setAutoMode($any($event.target).checked)"
        />
      </label>
    </div>
  </div>
</nav>
