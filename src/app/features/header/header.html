<nav
  class="fixed left-0 right-0 top-0 z-100 transition-all duration-500 ease-out bg-white/80 dark:bg-bg-green/85 backdrop-blur-2xl border-b border-amber-500/15 dark:border-amber-400/20 shadow-[0_10px_35px_-10px_rgba(15,23,42,0.08),inset_0_1px_0_rgba(255,255,255,0.8)] dark:shadow-[0_14px_45px_-10px_rgba(0,0,0,0.65),inset_0_1px_0_rgba(251,191,36,0.2)]"
  [ngClass]="{ '-translate-y-full': isHeaderHidden() }"
>
  <!-- Top Specular Shimmer -->
  <div
    class="pointer-events-none absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-amber-400/50 to-transparent"
  ></div>
  <div
    class="relative max-w-6xl mx-auto h-[72px] px-[16px] md:px-[24px] flex items-center justify-between"
  >
    <!-- Logo -->
    <a routerLink="/" class="flex items-center gap-[12px] group">
      <div
        class="relative w-[43px] h-[43px] rounded-[8px] bg-gradient-to-br from-sacred-gold via-divine-emerald to-amber-300 shadow-md shadow-amber-500/20 transition-all duration-300 group-hover:scale-105 group-hover:shadow-amber-500/40"
      >
        <img
          src="assets/images/logo.svg"
          alt="Icon"
          class="w-full h-full object-contain filter drop-shadow p-[2px]"
        />
      </div>

      <div class="flex flex-col">
        <h1
          class="text-[20px] font-extrabold bg-gradient-to-r from-emerald-600 via-teal-500 to-amber-500 bg-clip-text text-transparent"
        >
          Deen Companion
        </h1>
        <p
          class="text-[9px] font-bold uppercase tracking-[0.25em] text-sacred-gold/90 dark:text-sacred-gold drop-shadow-sm"
        >
          Quran • Hadees • Dua • Namaz
        </p>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden lg:flex items-center gap-[4px]">
      <div
        class="flex items-center gap-[4px] p-[4px] rounded-full bg-slate-100/60 dark:bg-white/[0.04] border border-slate-200/50 dark:border-white/5 backdrop-blur-xl shadow-sm"
      >
        <a
          routerLink="/"
          [routerLinkActiveOptions]="{ exact: true }"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Home
        </a>
        <a
          routerLink="/quran"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Quran
        </a>
        <a
          routerLink="/hadees"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Hadees
        </a>
        <a
          routerLink="/dua"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Dua
        </a>
        <a
          routerLink="/namaz-guide"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Namaz
        </a>
        <a
          routerLink="/islamic-videos"
          routerLinkActive="!bg-gradient-to-r !from-amber-400/20 !to-amber-500/20 !text-amber-800 dark:!text-amber-300 !shadow-[0_2px_10px_rgba(251,191,36,0.2)] !border-amber-400/40 dark:!border-amber-400/30"
          class="px-[16px] py-[8px] rounded-full text-[13.5px] font-semibold text-slate-600 dark:text-slate-300 border border-transparent hover:text-amber-700 dark:hover:text-amber-300 hover:bg-white/70 dark:hover:bg-white/10 transition-all duration-300"
        >
          Videos
        </a>
      </div>

      <!-- Theme Switch -->
      <div
        class="flex items-center gap-[8px] rounded-full bg-slate-100/60 dark:bg-white/[0.04] border border-slate-200/50 dark:border-white/5 backdrop-blur-xl px-[12px] py-[10px] shadow-sm"
      >
        <span class="text-[16px] select-none opacity-80">☀️</span>
        <button
          (click)="theme.toggleManual()"
          class="relative w-[44px] h-[24px] rounded-full bg-slate-300/80 dark:bg-emerald-950/80 p-[2px] border border-slate-300 dark:border-amber-500/40 shadow-inner transition-colors duration-300 cursor-pointer"
        >
          <!-- <div
            class="absolute top-[4px] left-[4px] dark:left-[28px] w-[16px] h-[16px] rounded-full bg-white dark:bg-sacred-gold shadow transition-all duration-300"
          ></div> -->
          <div
            class="w-[18px] h-[18px] rounded-full bg-white dark:bg-gradient-to-br dark:from-sacred-gold dark:to-amber-400 shadow-md transform transition-transform duration-300 translate-x-0 dark:translate-x-[20px]"
          ></div>
        </button>
        <span class="text-[16px] select-none opacity-80">🌙</span>

        <div class="w-px h-[20px] bg-slate-300/60 dark:bg-white/10"></div>

        <label
          class="flex items-center gap-[6px] text-[11px] font-medium tracking-wide text-slate-600 dark:text-amber-200/80 cursor-pointer select-none"
        >
          <input
            type="checkbox"
            class="w-[14px] h-[14px] accent-amber-500 rounded cursor-pointer"
            [checked]="theme.autoMode()"
            (change)="theme.setAutoMode($any($event.target).checked)"
          />
          Auto
        </label>
      </div>
    </div>

    <!-- Mobile Button -->
    <button
      class="lg:hidden p-[8px] rounded-[12px] border border-amber-500/20 dark:border-amber-400/20 bg-gradient-to-br dark:from-divine-emerald from-sacred-gold backdrop-blur-lg shadow-sm hover:border-amber-500/40 active:scale-95 transition-all duration-200"
      (click)="toggleMenu()"
      aria-label="Toggle Mobile Menu"
    >
      <svg
        class="w-[28px] h-[28px] text-emerald-700 dark:text-amber-300"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M4 12h16M4 17h16" />
      </svg>
    </button>

    <!-- Bottom Metallic Accent -->
    <div
      class="pointer-events-none absolute bottom-0 left-0 w-full h-px bg-gradient-to-r from-transparent via-sacred-gold/70 dark:via-amber-400/50 to-transparent"
    ></div>
  </div>

  <!-- Mobile Menu -->
  <div
    class="lg:hidden absolute right-[12px] top-full z-[110] w-[280px] rounded-[12px] border border-amber-500/25 dark:border-amber-400/20 bg-white/95 dark:bg-bg-green/95 backdrop-blur-2xl shadow-[0_20px_50px_rgba(0,0,0,0.25)] transition-all duration-300 ease-out origin-top-right overflow-hidden"
    [ngClass]="
      isToggle()
        ? 'opacity-100 scale-100 pointer-events-auto'
        : 'opacity-0 scale-95 pointer-events-none'
    "
  >
    <div class="p-[20px]">
      <a
        routerLink="/"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Home
      </a>
      <a
        routerLink="/quran"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Quran
      </a>
      <a
        routerLink="/hadees"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Hadees
      </a>

      <a
        routerLink="/dua"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Dua
      </a>
      <a
        routerLink="/namaz-guide"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Namaz
      </a>
      <a
        routerLink="/islamic-videos"
        routerLinkActive="bg-amber-100 dark:bg-amber-500/20 text-amber-700 dark:text-amber-300 shadow-sm"
        (click)="toggleMenu()"
        class="block rounded-xl px-[16px] py-[12px] text-[14px] font-medium hover:bg-amber-50 dark:hover:bg-white/5 transition"
      >
        Videos
      </a>

      <div class="border-t border-slate-200 dark:border-white/10 my-[12px]"></div>

      <div
        class="flex items-center justify-between rounded-xl bg-slate-50 dark:bg-white/5 p-[12px]"
      >
        <span class="text-[14px] font-medium">Theme</span>

        <!-- <button
          (click)="theme.toggleManual()"
          class="relative w-[48px] h-[24px] rounded-full bg-slate-300 dark:bg-premium-emerald"
        >
          <div
            class="absolute top-[4px] left-[4px] dark:left-[28px] w-[16px] h-[16px] rounded-full bg-white dark:bg-sacred-gold transition-all duration-300"
          ></div>
        </button> -->
        <button
          (click)="theme.toggleManual()"
          aria-label="Toggle Dark Mode"
          class="relative w-[44px] h-[24px] rounded-full bg-slate-300 dark:bg-emerald-950 p-[2px] border border-slate-300 dark:border-amber-500/40 shadow-inner cursor-pointer"
        >
          <div
            class="w-[16px] h-[16px] rounded-full bg-white dark:bg-gradient-to-br dark:from-sacred-gold dark:to-amber-400 shadow-md transform transition-transform duration-300 translate-x-0 dark:translate-x-[20px]"
          ></div>
        </button>
      </div>

      <label
        class="mt-[12px] flex items-center justify-between rounded-xl bg-slate-50 dark:bg-white/5 p-[12px] p-[12px] cursor-pointer"
      >
        <span class="text-[14px] font-medium">Automatic Theme</span>
        <input
          type="checkbox"
          class="w-[24px] h-[24px] accent-amber-500 rounded cursor-pointer"
          [checked]="theme.autoMode()"
          (change)="theme.setAutoMode($any($event.target).checked)"
        />
      </label>
    </div>
  </div>
</nav>
