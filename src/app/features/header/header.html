<nav
  class="sticky top-0 z-50 backdrop-blur-md py-2.5 shadow-lg dark:shadow-xl border-b bg-cream-bg/80 border-sacred-gold/80 dark:bg-slate-950/80 dark:border-white/15"
>
  <div class="px-4 max-w-6xl mx-auto flex justify-between items-center">
    <span
      class="text-xl font-bold tracking-tighter text-divine-emerald dark:text-sacred-gold uppercase"
      >Deen Companion</span
    >

    <div
      class="max-md:hidden flex items-center gap-6 text-sm font-medium uppercase tracking-widest text-slate-500 dark:text-slate-400"
    >
      <!-- <a href="#" class="hover:text-sacred-gold transition-colors">Hadees</a>
        <a href="#" class="hover:text-sacred-gold transition-colors">Dua</a> -->

      <div class="grid grid-cols-2 border border-slate-400 dark:border-white/20 rounded-full p-1.5">
        <button
          (click)="theme.toggleManual()"
          class="w-12 h-6 rounded-full bg-slate-300 dark:bg-zinc-800 relative transition-colors cursor-pointer"
        >
          <div
            class="absolute top-1 left-1 dark:left-7 w-4 h-4 rounded-full bg-white dark:bg-sacred-gold transition-all duration-300 shadow-sm"
          ></div>
        </button>
        <label class="text-[0.8rem] flex items-center gap-1.5 cursor-pointer">
          <input
            type="checkbox"
            class="w-3.5 h-3.5 cursor-pointer"
            [checked]="theme.autoMode()"
            (change)="theme.setAutoMode($any($event.target).checked)"
          />
          Auto
        </label>
      </div>
    </div>
    <button class="md:hidden burger" (click)="toggleMenu()">
      <svg
        width="18"
        height="18"
        viewBox="0 0 18 18"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
      >
        <path d="M2 4.5h14M2 9h14M2 13.5h14"></path>
      </svg>
    </button>
  </div>
  <!-- <div
    class="mnav absolute top-full left-0 w-full bg-[#f8f5ef] dark:bg-night-deep border-b border-sacred-gold/80 dark:border-white/10 px-4 pb-4 transition-all duration-300"
    class="mnav bg-[#f8f5ef] dark:bg-night-deep"
    [ngClass]="{
      block: isToggle(),
      hidden: !isToggle(),
    }"
  > -->
  <div
    class="mnav absolute top-full left-0 w-full bg-[#f8f5ef] dark:bg-night-deep border-b border-sacred-gold/80 dark:border-white/10 px-4 pb-4 transition-all duration-300"
    [ngClass]="
      isToggle() ? 'translate-y-0 opacity-100' : '-translate-y-4 opacity-0 pointer-events-none'
    "
  >
    <!-- <a href="#" class="hover:text-sacred-gold transition-colors block pt-2">Hadees</a>
    <a href="#" class="hover:text-sacred-gold transition-colors block py-2">Dua</a> -->

    <div class="grid grid-cols-2 border border-slate-400 dark:border-white/20 rounded-full p-1.5">
      <button
        (click)="theme.toggleManual()"
        class="w-12 h-6 rounded-full bg-slate-300 dark:bg-zinc-800 relative transition-colors cursor-pointer"
      >
        <div
          class="absolute top-1 left-1 dark:left-7 w-4 h-4 rounded-full bg-white dark:bg-sacred-gold transition-all duration-300 shadow-sm"
        ></div>
      </button>
      <label class="text-[0.8rem] flex items-center gap-1.5 cursor-pointer">
        <input
          type="checkbox"
          class="w-3.5 h-3.5 cursor-pointer"
          [checked]="theme.autoMode()"
          (change)="theme.setAutoMode($any($event.target).checked)"
        />
        Auto
      </label>
    </div>
  </div>
</nav>
