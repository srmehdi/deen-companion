<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <!-- Deep Emerald to Antique Gold Background -->
    <!-- <linearGradient id="divineSacredGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b16" />
      <stop offset="50%" stop-color="#0e2a22" />
      <stop offset="100%" stop-color="#b38728" />
    </linearGradient> -->

    <!-- Polished Gold Metallic Gradient for Accents -->
    <linearGradient id="premiumGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fff4d0" />
      <stop offset="70%" stop-color="#ecd085" />
      <stop offset="100%" stop-color="#c99f3b" />
    </linearGradient>

    <linearGradient id="divineSacredGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#071b16" />
      <stop offset="55%" stop-color="#0e2a22" />
      <stop offset="82%" stop-color="#b38728" />
    </linearGradient>

    <!-- Subtle Depth Shadow -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.45" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Rounded Container (Scaled to 48x48) -->
  <rect width="48" height="48" rx="17.8" fill="url(#divineSacredGradient)" />

  <!-- Premium Inset Filigree Border -->
  <rect x="2.5" y="2.5" width="43" height="43" rx="15.5" fill="none" stroke="url(#premiumGold)" stroke-width="0.4" opacity="0.4" />

  <!-- Center Crescent Glyphic Accent -->
  <text 
    x="50%" 
    y="60%" 
    font-size="6.7" 
    font-family="sans-serif"
    font-weight="bold"
    fill="#ffffff" 
    text-anchor="middle" 
    dominant-baseline="middle"
  >☪</text>

  <g fill="url(#premiumGold)" filter="url(#luxuryGlow)">
    <!-- Bold Calligraphic 'DC' Text (Enlarged & Centered) -->
    <text 
      x="51%" 
      y="37%" 
      font-size="24" 
      font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Times New Roman', serif" 
      font-weight="1000"
      text-anchor="middle" 
      dominant-baseline="central"
      letter-spacing="1"
    >DC</text>

    <!-- Refined Quran Pages & Rehal Stand (Lowered Position) -->
    <g transform="translate(12.3, 29.5) scale(1.02)" opacity="0.88">
      <!-- Thinned Left Page -->
      <path d="M 11 1.8 C 7.8 0.8 3.8 1.1 1.2 2.1 C 0.8 2.2 0.6 2.5 0.6 2.8 L 0.6 6.2 C 0.6 6.5 0.9 6.7 1.2 6.6 C 3.6 5.7 7.5 5.5 11 6.4 Z" />
      
      <!-- Thinned Right Page -->
      <path d="M 12 1.8 C 15.2 0.8 19.2 1.1 21.8 2.1 C 22.2 2.2 22.4 2.5 22.4 2.8 L 22.4 6.2 C 22.4 6.5 22.1 6.7 21.8 6.6 C 19.4 5.7 15.5 5.5 12 6.4 Z" />
      
      <!-- Delicate Rehal Stand Base -->
      <!-- Left Leg -->
      <path d="M 2.2 7.2 L 10.8 11.8 L 9.8 12.4 L 4.8 12.4 C 5 11.6 4.3 11 3.5 11 C 2.8 11 2.2 11.5 2.2 12.4 L 1.2 12.4 Z" />
      
      <!-- Right Leg -->
      <path d="M 20.8 7.2 L 12.2 11.8 L 13.2 12.4 L 18.2 12.4 C 18 11.6 18.7 11 19.5 11 C 20.2 11 20.8 11.5 20.8 12.4 L 21.8 12.4 Z" />
      
      <!-- Center Pivot Stud -->
      <circle cx="11.5" cy="11.5" r="0.45" />
    </g>
  </g>
</svg>
