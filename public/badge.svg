<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96">
  <!-- 
    NOTIFICATION BADGE SVG (Android Alpha Mask Compliant):
    - Circular outer ring (#FFFFFF stroke, transparent fill)
    - Pure solid white (#FFFFFF) glyphs and elements
    - 100% transparent canvas/background
  -->

  <!-- Circular Outer Strip / Border -->
  <circle 
    cx="24" 
    cy="24" 
    r="22" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="1.8" 
  />

  <g fill="#FFFFFF">
    <!-- Calligraphic 'DC' Text (Centered & Proportioned) -->
    <text 
      x="50%" 
      y="36%" 
      font-size="20" 
      font-family="'Cinzel', 'Trajan Pro', 'Cinzel Decorative', 'Times New Roman', serif" 
      font-weight="1000" 
      text-anchor="middle" 
      dominant-baseline="central" 
      letter-spacing="0.8"
    >DC</text>
    
    <!-- Center Crescent Glyphic Accent -->
    <text 
      x="50%" 
      y="58%" 
      font-size="6" 
      font-family="sans-serif" 
      font-weight="bold" 
      text-anchor="middle" 
      dominant-baseline="middle"
    >☪</text>

    <!-- Refined Quran Pages & Rehal Stand Base -->
    <g transform="translate(13.8, 29) scale(0.9)">
      <!-- Left Page -->
      <path d="M 11 1.8 C 7.8 0.8 3.8 1.1 1.2 2.1 C 0.8 2.2 0.6 2.5 0.6 2.8 L 0.6 6.2 C 0.6 6.5 0.9 6.7 1.2 6.6 C 3.6 5.7 7.5 5.5 11 6.4 Z" />
      
      <!-- Right Page -->
      <path d="M 12 1.8 C 15.2 0.8 19.2 1.1 21.8 2.1 C 22.2 2.2 22.4 2.5 22.4 2.8 L 22.4 6.2 C 22.4 6.5 22.1 6.7 21.8 6.6 C 19.4 5.7 15.5 5.5 12 6.4 Z" />
      
      <!-- Rehal Stand Legs & Pivot Stud -->
      <path d="M 2.2 7.2 L 10.8 11.8 L 9.8 12.4 L 4.8 12.4 C 5 11.6 4.3 11 3.5 11 C 2.8 11 2.2 11.5 2.2 12.4 L 1.2 12.4 Z" />
      <path d="M 20.8 7.2 L 12.2 11.8 L 13.2 12.4 L 18.2 12.4 C 18 11.6 18.7 11 19.5 11 C 20.2 11 20.8 11.5 20.8 12.4 L 21.8 12.4 Z" />
      <circle cx="11.5" cy="11.5" r="0.45" />
    </g>
  </g>
</svg>
